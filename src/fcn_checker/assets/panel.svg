<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PANEL 圖示「雙頁比對」：紅頭 PDF 疊在綠頭條件表上，右下角打勾。48px 以上使用。
       更新圖示：以瀏覽器把兩份 SVG 直接畫成各尺寸 PNG（不從大圖縮小），再用 Pillow 組成 panel.ico：
       panel.svg → 256/128/64/48，panel-small.svg → 32/24/16。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B4A5E"/><stop offset="1" stop-color="#161E2B"/></linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <g transform="rotate(-8 100 120)">
    <rect x="40" y="48" width="112" height="144" rx="12" fill="#F1F3F7"/>
    <path d="M40 60 a12 12 0 0 1 12 -12 H140 a12 12 0 0 1 12 12 V74 H40Z" fill="#E5484D"/>
    <rect x="56" y="94" width="72" height="11" rx="5.5" fill="#B8C0CE"/>
    <rect x="56" y="118" width="52" height="11" rx="5.5" fill="#B8C0CE"/>
  </g>
  <rect x="100" y="76" width="116" height="148" rx="12" fill="#FFFFFF"/>
  <path d="M100 88 a12 12 0 0 1 12 -12 H204 a12 12 0 0 1 12 12 V104 H100Z" fill="#1F9D63"/>
  <g stroke="#C9D3CF" stroke-width="5">
    <line x1="100" y1="136" x2="216" y2="136"/><line x1="100" y1="168" x2="216" y2="168"/>
    <line x1="146" y1="104" x2="146" y2="224"/>
  </g>
  <circle cx="196" cy="200" r="36" fill="#FFFFFF" stroke="#161E2B" stroke-width="8"/>
  <path d="M179 201 l12 12 l22 -24" fill="none" stroke="#1F9D63" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

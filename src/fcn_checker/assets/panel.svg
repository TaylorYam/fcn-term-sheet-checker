    <rect x="44" y="106" width="64" height="12" rx="6" fill="#B8C0CE"/>
    <rect x="24" y="20" width="136" height="176" rx="14" fill="none" stroke="#7D8796" stroke-width="5"/>
  </g>
  <rect x="92" y="60" width="144" height="184" rx="14" fill="#FFFFFF"/>
  <path d="M92 74 a14 14 0 0 1 14 -14 H222 a14 14 0 0 1 14 14 V98 H92Z" fill="#1F9D63"/>

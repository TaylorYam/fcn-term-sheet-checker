  <rect x="92" y="60" width="144" height="184" rx="14" fill="none" stroke="#7D8796" stroke-width="5"/>
  <circle cx="196" cy="204" r="44" fill="#1F9D63" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M175 205 l14 14 l27 -30" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

# 參考條件表格式：FCN參考條件 Excel 的「樣本清單」工作表（所有上手共用）
#
# 核對條件的來源，也是核對後匯入資料庫的格式（ADR 0004）。每列一檔商品、多家上手混在同一張表。
# 以說明書商品代號找 TDCC Code 相同的列；該列的發行機構必須是對應上手的值。
# 回填欄位（ISIN Code、發行日、比價日_1～12）由工具依說明書填入；其他欄位由作業人員事先填好，只做核對。
# 規則說明見 docs/order-formats/reference-sheet.md。

version = 1
effective_date = 2026-10-02

[layout]
sheet = "樣本清單"
header_row = 3
first_data_row = 4
key_column = "TDCC Code"  # 商品代號，用來配對說明書；同一代號出現多列 → 轉人工覆核
issuer_column = "發行機構"
empty_value = "-"         # 空值寫法（比價日不需要填的期別也寫 -）

# 上手代號 → 該上手在「發行機構」欄的寫法
[issuer_values]
BARC = "Barclays"
HSBC = "HSBC"

# Excel 欄名 → 標準欄位
[columns]
"TDCC Code" = "product_code"
"ISIN Code" = "isin"
"單位面額" = "denomination"
"承作幣別" = "currency"
"交易日" = "trade_date"
"發行日" = "issue_date"
"最終比價日" = "final_valuation_date"
"到期日" = "maturity_date"
"KO(%)" = "ko_pct"
"KO(Freq)" = "ko_observation"
"KO(memo)" = "ko_memory"
"K(%)" = "strike_pct"
"KI(%)" = "ki_pct"
"KI(Freq)" = "ki_type"
"Coupon p.a. (%)" = "coupon_pa_pct"
"天期(月)" = "tenor_months"
"Non-Call(月)" = "first_callable_period"
"比價日_1" = "autocall_date_1"
"比價日_2" = "autocall_date_2"
"比價日_3" = "autocall_date_3"
"比價日_4" = "autocall_date_4"
"比價日_5" = "autocall_date_5"
"比價日_6" = "autocall_date_6"
"比價日_7" = "autocall_date_7"
"比價日_8" = "autocall_date_8"
"比價日_9" = "autocall_date_9"
"比價日_10" = "autocall_date_10"
"比價日_11" = "autocall_date_11"
"比價日_12" = "autocall_date_12"
"UL_1" = "underlying_1"
"UL_1_進場價" = "underlying_1_initial_price"
"UL_1_執行價" = "underlying_1_strike_price"
"UL_1_下限價" = "underlying_1_ki_price"
"UL_1_KO價" = "underlying_1_ko_price"
"UL_2" = "underlying_2"
"UL_2_進場價" = "underlying_2_initial_price"
"UL_2_執行價" = "underlying_2_strike_price"
"UL_2_下限價" = "underlying_2_ki_price"
"UL_2_KO價" = "underlying_2_ko_price"
"UL_3" = "underlying_3"
"UL_3_進場價" = "underlying_3_initial_price"
"UL_3_執行價" = "underlying_3_strike_price"
"UL_3_下限價" = "underlying_3_ki_price"
"UL_3_KO價" = "underlying_3_ko_price"
"UL_4" = "underlying_4"
"UL_4_進場價" = "underlying_4_initial_price"
"UL_4_執行價" = "underlying_4_strike_price"
"UL_4_下限價" = "underlying_4_ki_price"
"UL_4_KO價" = "underlying_4_ko_price"
"UL_5" = "underlying_5"
"UL_5_進場價" = "underlying_5_initial_price"
"UL_5_執行價" = "underlying_5_strike_price"
"UL_5_下限價" = "underlying_5_ki_price"
"UL_5_KO價" = "underlying_5_ko_price"

# 存續或內部資訊，說明書沒有對應資料，不核對；發行機構只用來確認列屬於哪家上手
ignored = ["庫存狀態", "當日比價", "Product", "發行機構", "私銀註記", "UF",
           "UL_1_Memo", "UL_2_Memo", "UL_3_Memo", "UL_4_Memo", "UL_5_Memo"]
# 無表頭的欄（例：已 KO 註記）一律忽略

# KO(Freq)：D 期間每日觀察／P 每期定日觀察
[values.ko_observation]
"D" = "D"
"P" = "P"

# KO(memo)：記憶式
[values.ko_memory]
"Y" = true
"N" = false

# KI(Freq)：none 無／AM 到期觀察／D 每日觀察
[values.ki_type]
"-" = "none"
"AM" = "AM"
"D" = "D"

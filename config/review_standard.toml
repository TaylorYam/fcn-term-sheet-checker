# 審查標準（Review Standard）
#
# 受託機構會隨時間更新的審查基準集中在這個檔案。
# 基準改變時（例如受託機構重新審查、風險警語改版），只修改本檔，不改程式。
# 每次修改請更新 version 與 effective_date，並在 PR 說明變更原因。
#
# 本檔只放公開的條款文字與日期，不放客戶或交易資料。
# 規則說明見 docs/rules/review-standard.md。

version = 1
effective_date = 2026-10-01

[distributor]
# 受託或銷售機構審查通過之日期（說明書封面 p1）
approval_date = 2026-06-11

# 受託或銷售機構負責人（第二章「受託或銷售機構」→「負責人姓名」）
# 注意：「晋」為古字 U+664B，不可寫成「晉」U+6649；比對時逐字（含字碼）相等。
chairman = "林晋輝"

[risk]
# 風險等級（說明書中以【RRn】出現）
level = "RR4"

# 固定風險警語：由我方提供給上手，應逐字出現在說明書中。
# 比對時忽略所有空白與換行，其餘字元（含全形／半形標點）須完全相同。
# BARC 範本中應出現 3 次：封面警語 1、第一章第 2 條、第三章投資風險警語。
fixed_warning = """\
本商品風險程度等級為【RR4】。根據受託機構的風險等級分類，由於本商品並不保本，連結標的為【證券交易所交易證券】，\
在綜合評量包括但不僅限於產品天期、發行機構信用評等與前述因素後，根據受託機構受託買賣境外商品審查管理辦法之\
境外結構型商品風險及適合度評估標準將本商品在風險等級中歸類為【RR4】。*投資人請注意，受託機構將風險等級區分為\
RR1~RR5，RR1、RR2為保守型，RR3、RR4為穩健型，RR5為積極型，本商品風險等級由受託機構釐定及提供，發行機構及/或\
總代理人不對此評級之準確性負任何責任。受託對象僅限依據境外結構型商品管理規則(下稱「管理規則」)投資本商品之\
專業投資人或依據國際證券業務分公司(下稱「OSU」)辦理受託買賣相關規定允許投資本商品之中華民國境外客戶(此類客戶\
依受託機構審核適合投資本產品)(下稱「OSU客戶」) (專業投資人與OSU客戶以下合稱「投資人」)。"""
fixed_warning_occurrences = 3

[wording]
# 「受託投資」須改為「受託買賣」；但法規原文片語「受託投資或受託買賣」允許出現。
forbidden = ["受託投資"]
allowed_phrases = ["受託投資或受託買賣"]

[product_name.barc]
# 商品名稱格式（依最新 5 份 BARC 說明書，2026-10-01 確認）
# 佔位符：{tenor} 天期月數、{ccy_zh}／{ccy} 幣別中文／ISO 代碼、{memory_zh}／{memory_en} 記憶式時填入
zh = "英商巴克萊銀行{tenor}個月{ccy_zh}計價連結股權{memory_zh}自動提前出場結構型商品（不保本）（無擔保及無保證機構）（下稱「本商品」）"
en = "{tenor} Months {ccy} {memory_en}Autocallable Equity Linked Note issued by Barclays Bank PLC (unsecured and non-guaranteed)"
memory_zh = "記憶式"
memory_en = "Memory "
# 半形／全形括號差異不視為錯誤（比對前統一為全形）
normalize_brackets = true

[currency]
# 說明書中文幣別 → ISO 代碼
"美元" = "USD"
"日幣" = "JPY"
"人民幣" = "CNH"

[dates]
# 中文產品說明書刊印日期：交易日當天或之後 N 個日曆日內
print_date_max_days_after_trade = 1

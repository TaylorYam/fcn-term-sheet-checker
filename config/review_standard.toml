[product_type]
bnp = "股權連結結構型商品"
# SG 寫「債券」，不隨標的數改變（2026-10-13 確認）。
sg = "股權連結結構型債券"
# Citi：不隨標的數改變（2026-10-14 確認，Issue #220）。
citi = "連結股權結構型商品"
# JPM：同 BNP 寫法，不隨標的數改變（2026-10-15 確認，Issue #233）。
jpm = "股權連結結構型商品"
# Nomura：不隨標的數改變（2026-10-15 確認，Issue #239）。
nomura = "連結股權之結構型債券"

# 第四章「發行不成立之情形」的最低有效申購金額寫法（鍵為上手代號小寫）；忽略空白後逐字相等。
# BNP：7 份樣本皆為 (等值)300,000 美元（2026-10-13 確認納入）。
[minimum_issue_size]
bnp = "(等值)300,000 美元"
# Citi：8 份樣本皆為「等值30 萬美元」（JPY、CNH 商品也寫美元；2026-10-14 確認納入，Issue #220）。
citi = "等值30 萬美元"
# Nomura：8 份樣本皆為「三十萬美元」（AUD、JPY 商品也寫美元；2026-10-15 確認，Issue #239）。
nomura = "三十萬美元"

# 各最低金額出處 = 參考條件表「單位面額」× 倍數（鍵為上手代號小寫，再分出處欄位名稱）；沒列出的出處倍數為 1。
# BNP：最低申購、最低贖回為 5 倍，最低加購、增加贖回單位為 1 倍（2026-10-13 使用者確認為 BNP 專屬規則）。
[min_amount_multiples.bnp]
minimum_subscription = 5
minimum_additional = 1
minimum_redemption = 5
redemption_increment = 1

# SG：最低申購金額依承作幣別為單位面額的倍數（USD 10 倍、JPY／CNH 1 倍；沒列的幣別轉人工覆核），
# 最低加購、最低贖回為 1 倍（2026-10-13 使用者確認）。倍數寫成 {ISO 代碼 = 倍數} 時依參考條件表「承作幣別」選。
[min_amount_multiples.sg]
minimum_subscription = { USD = 10, JPY = 1, CNH = 1 }
minimum_additional = 1
minimum_redemption = 1

[currency]
# 說明書中文幣別 → ISO 代碼。封面與金額旁的幣別字都查這張表（金額旁的幣別字 parser 認得的寫法見
# src/fcn_checker/parsers/money.py）；商品幣別不必等於標的幣別（Issue #170）。
# 只收說明書樣本看過的寫法（不猜），沒看過的寫法轉人工覆核（2026-10-10 使用者決定，Issue #170）。
# AUD、EUR、GBP、ZAR 有樣本後加入樣本上的寫法；澳元、南非蘭特等同義寫法沒有樣本，不加（2026-10-13，Issue #185）。
"美元" = "USD"
"日幣" = "JPY"
"日圓" = "JPY"  # 同義寫法，尚無樣本（2026-10-10 使用者同意先加）
"人民幣" = "CNH"
"境外人民幣" = "CNH"  # BARC 第四章最低金額旁的寫法
"港幣" = "HKD"  # MS 樣本的寫法
"港元" = "HKD"  # 同義寫法，尚無樣本
"澳幣" = "AUD"  # HSBC、MS 樣本的寫法
"歐元" = "EUR"  # HSBC 樣本的寫法
"英鎊" = "GBP"  # HSBC 樣本的寫法
"南非幣" = "ZAR"  # MS 樣本的寫法

[denomination]
# 每單位商品面額預設值（依計價幣別；可承作的八種幣別，2026-10-10 使用者提供的承作幣別表）。客戶可要求不同面額，
# 因此說明書面額不等於預設值時「轉人工審查」，不直接判為錯誤。
USD = 10000
JPY = 1000000
CNH = 100000
HKD = 100000
AUD = 10000
EUR = 10000
GBP = 10000
ZAR = 100000

[dates]
# 中文產品說明書刊印日期：交易日當天或之後 N 個日曆日內
print_date_max_days_after_trade = 1

[iis]
# 投資人須知（檔名結尾 _IIS，docs/rules/iis-check-rules.md）：必須剛好 N 頁。
# 使用者 2026-10-08 確認：比外規「不超過 5 頁」嚴格，5 頁也判不一致。
pages = 4

# 固定風險警語（依上手版本，同上）在投資人須知出現的次數（鍵為上手代號小寫）；沒列出的上手轉人工覆核。
# BARC：警語第 1 點；HSBC：警語一、商品簡介第 3 點（2026-10-08 依樣本確認）；MS：警語 1)（2026-10-09 確認，Issue #137）；
# BNP：警語 1、商品簡介「商品風險程度」整段重寫一次（2026-10-14 確認，Issue #197）；SG：警語一（2026-10-14 確認，Issue #213）。
[iis.fixed_warning_occurrences]
barc = 1
hsbc = 2
ms = 1
bnp = 2
sg = 1
citi = 1  # 警語 1.（2026-10-14 確認，Issue #220）
jpm = 1  # 警語 1.（2026-10-15 確認，Issue #233）
nomura = 1  # 警語(一)（2026-10-15 確認，Issue #239）

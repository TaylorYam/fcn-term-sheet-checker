sg = ["""本商品風險程度等級為[RR4]。根據受託機構的風險等級分類，由於本商品並不保本，連結標的為證券交易所交易證券，在綜合評量包括但不僅限於產品天期、發行機構信用評等與前述因素後，根據受託機構受託買賣境外商品審查管理辦法之境外結構型商品風險及適合度評估標準將本商品在風險等級中歸類為[RR4]。*投資人請注意，受託機構將風險等級區分為RR1~RR5，RR1、RR2為保守型，RR3、RR4為穩健型，RR5為積極型，本商品風險等級由受託機構釐定及提供，發行機構及/或總代理人不對此評級之準確性負任何責任。受託對象僅限依據境外結構型商品管理規則(下稱「管理規則」)投資本商品之專業投資人或依據國際證券業務分公司(下稱「OSU」)辦理受託買賣相關規定允許投資本商品之中華民國境外客戶(此類客戶依受託機構審核適合投資本產品)(下稱「OSU客戶」) (專業投資人與OSU客戶以下合稱「投資人」)。"""]


# 審查標準（Review Standard）
#
# 受託機構會隨時間更新的審查基準集中在這個檔案。
# 基準改變時（例如受託機構重新審查、風險警語改版），只修改本檔，不改程式。
# 每次修改請更新 version 與 effective_date，並在 PR 說明變更原因。
#
# 本檔只放公開的條款文字與日期，不放客戶或交易資料。
# 規則說明見 docs/rules/review-standard.md。

version = 7
effective_date = 2026-10-08

[distributor]
# 受託或銷售機構審查通過之日期（說明書封面 p1）：歷次日期都保留，由舊到新。
# 每份說明書應寫「交易日當天或之前最近一次」的日期。重新審查後在 PANEL「審查通過日期…」新增，
# 或在清單最後加一筆（同時更新上面的 version 與 effective_date）。
approval_dates = [2025-12-18, 2026-06-11]

# 受託或銷售機構負責人（第二章「受託或銷售機構」→「負責人姓名」）
# 注意：「晋」為古字 U+664B，不可寫成「晉」U+6649；比對時逐字（含字碼）相等。
chairman = "林晋輝"

# 受託或銷售機構名稱、電話、地址（封面「受託或銷售機構之名稱、電話及地址」、第二章「受託或銷售機構」條）
# 比對時忽略空白與換行，其餘逐字相等。
name = "玉山綜合證券股份有限公司"
phone = "02-5556-1313"
# 電話可接受的其他寫法（所有上手適用）；忽略空白後與其中之一相等即視為相符，沒列出的寫法判定不一致。
# 國際寫法：HSBC 封面使用（2026-10-02 確認）。
phone_equivalents = ["+886-2-5556-1313"]
address = "台北市松山區民生東路三段158號6樓"

[risk]
# 風險等級（說明書中以【RRn】出現）
level = "RR4"

# 固定風險警語：由我方提供給上手，應逐字出現在說明書中。
# 比對時忽略所有空白與換行，其餘字元（含全形／半形標點）須完全相同。
# BARC 範本中應出現 3 次：封面警語 1、第一章第 2 條、第三章投資風險警語。
fixed_warning = """\
本商品風險程度等級為【RR4】。根據受託機構的風險等級分類，由於本商品並不保本，連結標的為【證券交易所交易證券】，\
在綜合評量包括但不僅限於產品天期、發行機構信用評等與前述因素後，根據受託機構受託買賣境外商品審查管理辦法之\
境外結構型商品風險及適合度評估標準將本商品在風險等級中歸類為【RR4】。*投資人請注意，受託機構將風險等級區分為\
RR1~RR5，RR1、RR2為保守型，RR3、RR4為穩健型，RR5為積極型，本商品風險等級由受託機構釐定及提供，發行機構及/或\
總代理人不對此評級之準確性負任何責任。受託對象僅限依據境外結構型商品管理規則(下稱「管理規則」)投資本商品之\
專業投資人或依據國際證券業務分公司(下稱「OSU」)辦理受託買賣相關規定允許投資本商品之中華民國境外客戶(此類客戶\
依受託機構審核適合投資本產品)(下稱「OSU客戶」) (專業投資人與OSU客戶以下合稱「投資人」)。"""
fixed_warning_occurrences = 3

# 依上手不同的固定警語版本（鍵為上手代號小寫）。未列出的上手使用上面的 fixed_warning。
# HSBC：前 4 處「受託機構」寫成「受託或銷售機構」，第 5 處「依受託機構審核」不變（2026-10-01 確認視為正確）。
# HSBC 範本中同樣出現 3 次：封面警語 1、第一章第 2 條、第三章。
[risk.fixed_warning_by_issuer]
hsbc = """\
本商品風險程度等級為【RR4】。根據受託或銷售機構的風險等級分類，由於本商品並不保本，連結標的為【證券交易所交易證券】，\
在綜合評量包括但不僅限於產品天期、發行機構信用評等與前述因素後，根據受託或銷售機構受託買賣境外商品審查管理辦法之\
境外結構型商品風險及適合度評估標準將本商品在風險等級中歸類為【RR4】。*投資人請注意，受託或銷售機構將風險等級區分為\
RR1~RR5，RR1、RR2為保守型，RR3、RR4為穩健型，RR5為積極型，本商品風險等級由受託或銷售機構釐定及提供，發行機構及/或\
總代理人不對此評級之準確性負任何責任。受託對象僅限依據境外結構型商品管理規則(下稱「管理規則」)投資本商品之\
專業投資人或依據國際證券業務分公司(下稱「OSU」)辦理受託買賣相關規定允許投資本商品之中華民國境外客戶(此類客戶\
依受託機構審核適合投資本產品)(下稱「OSU客戶」) (專業投資人與OSU客戶以下合稱「投資人」)。"""

[issuer_name]
# 發行機構中英文法人全名（鍵為上手代號小寫）：封面「發行機構」與第二章「發行機構」條的「事業名稱」。
# 比對時忽略空白與換行，其餘（含全形括號）逐字相等。
barc = "英商巴克萊銀行股份有限公司（Barclays Bank PLC）"

hsbc = "香港商香港上海滙豐銀行股份有限公司（THE HONGKONG AND SHANGHAI BANKING CORPORATION LIMITED）"

[fees]
# 第四章「投資人應負擔的各項費用」表的費率區間（鍵為表中費用項目名稱）；忽略空白後逐字相等。
"申購費用" = "0%~5%"
"提前贖回費用" = "0%~5%"
"分銷費用" = "0%~5%"

[issue_price]
# 第一章第 6 條「發行價格為商品面額之 N%」。不等於此值時轉人工覆核，不直接判為錯誤。
pct = 100

[wording]
# 「受託投資」須改為「受託買賣」；但法規原文片語「受託投資或受託買賣」允許出現。
forbidden = ["受託投資"]
allowed_phrases = [
    "受託投資或受託買賣",
    # HSBC 封面警語 7 與第三章：境外結構型商品管理規則的列舉寫法（2026-10-01 確認允許）
    "受託投資、受託買賣或為投資型保單",
]

[product_name.barc]
# 商品名稱格式（依最新 5 份 BARC 說明書，2026-10-01 確認）
# 佔位符：{tenor} 天期月數、{ccy_zh}／{ccy} 幣別中文／ISO 代碼、{memory_zh}／{memory_en} 記憶式時填入
zh = "英商巴克萊銀行{tenor}個月{ccy_zh}計價連結股權{memory_zh}自動提前出場結構型商品（不保本）（無擔保及無保證機構）（下稱「本商品」）"
en = "{tenor} Months {ccy} {memory_en}Autocallable Equity Linked Note issued by Barclays Bank PLC (unsecured and non-guaranteed)"
memory_zh = "記憶式"
memory_en = "Memory "
# 半形／全形括號差異不視為錯誤（比對前統一為全形）
normalize_brackets = true

[product_name.hsbc]
# 商品名稱格式（依 8 份 HSBC 說明書推得，2026-10-01 確認照此核對）
# 佔位符同 BARC；{maxi_en} 標的數 ≥ 2 時填入、{daily_en} 提前出場每日觀察時填入
zh = "香港上海滙豐銀行{tenor}個月{ccy_zh}計價{memory_zh}自動提前到期固定配息股權連結（無保證機構無擔保）（不保本）結構型商品（以下簡稱「本商品」）"
en = "{maxi_en}{daily_en}{memory_en}Autocallable Fixed Coupon Notes (Non Guaranteed, Unsecured)"
memory_zh = "記憶式"
memory_en = "Memory "
maxi_en = "Maxi "
daily_en = "Daily "
normalize_brackets = true
# 英文名稱在 PDF 換行處常黏字（例 CouponNotes），比對時忽略所有空白
ignore_whitespace_en = true

[currency]
# 說明書中文幣別 → ISO 代碼
"美元" = "USD"
"日幣" = "JPY"
"人民幣" = "CNH"

[denomination]
# 每單位商品面額預設值（依計價幣別）。客戶可要求不同面額，
# 因此說明書面額不等於預設值時「轉人工審查」，不直接判為錯誤。
USD = 10000
JPY = 1000000
CNH = 100000

[dates]
# 中文產品說明書刊印日期：交易日當天或之後 N 個日曆日內
print_date_max_days_after_trade = 1

[iis]
# 投資人須知（檔名結尾 _IIS，docs/rules/iis-check-rules.md）：必須剛好 N 頁。
# 使用者 2026-10-08 確認：比外規「不超過 5 頁」嚴格，5 頁也判不一致。
pages = 4

# 固定風險警語（依上手版本，同上）在投資人須知出現的次數（鍵為上手代號小寫）；沒列出的上手轉人工覆核。
# BARC：警語第 1 點；HSBC：警語一、商品簡介第 3 點（2026-10-08 依樣本確認）。
[iis.fixed_warning_occurrences]
barc = 1
hsbc = 2
